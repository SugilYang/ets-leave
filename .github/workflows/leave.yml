name: 연차 자동반영

on:
  schedule:
    - cron: '0 21 * * *'      # 매일 06:00 KST (UTC 21:00, 전날)
  workflow_dispatch:           # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: 실행
        env:
          DAOU_URL: ${{ secrets.DAOU_URL }}
          DAOU_ID: ${{ secrets.DAOU_ID }}
          DAOU_PW: ${{ secrets.DAOU_PW }}
          GAS_URL: ${{ secrets.GAS_URL }}
          LEAVE_TOKEN: ${{ secrets.LEAVE_TOKEN }}
        run: python leave_sync.py
      - name: 실패 시 화면 캡처 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
      - name: 본 문서 목록 저장
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add seen_docs.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "seen_docs $(date -u +%F)"
          git push || true
